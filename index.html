<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snowglobe</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="hero">
        <h1>Flakes</h1>
        <p class="tagline">shake it for a little winter kindness</p>
    </header>
    <main>
        <section class="globe-card">
            <div class="globe" id="globe">
                <img class="scene" src="snowglobe.png" alt="a snowglobe" />
            </div>
            <button id="shake">shake the globe</button>
            <p class="message" id="message">press the button and see what settles</p>
        </section>
        <section>
            <button id="motivate">Motivational Quotes</button>
            <p class="quote" id="quote">To encourage you</p>
        </section>
    </main>
    <footer>
        <p>made by Grace, in the snow</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
